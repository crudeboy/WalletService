spring.application.name=wallet

# ===============================
# Server
# ===============================
server.port=8080

# ===============================
# Datasource (PostgreSQL)
# ===============================
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/walletdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:walletuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:walletpass}

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.show_sql=false

logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql=OFF

# ===============================
# Hikari Connection Pool
# ===============================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.pool-name=WalletHikariPool

# ===============================
# Logging
# ===============================
logging.level.root=INFO
logging.level.com.example.wallet=DEBUG

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

# ===============================
# Kafka - Common
# ===============================
spring.kafka.bootstrap-servers=kafka:29092

# ===============================
# Kafka Producer
# ===============================
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.linger-ms=5

# ===============================
# Kafka Consumer
# ===============================
spring.kafka.consumer.group-id=${spring.application.name}-consumer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=true

# ===============================
# Kafka Admin / Safety
# ===============================
spring.kafka.admin.auto-create=false

# ===============================
# Jackson (JSON)
# ===============================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
